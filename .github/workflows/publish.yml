name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:

  publish:
    runs-on: ubuntu-latest
    # container: unityci/editor:6000.0.85f1-base-3
    permissions:
      contents: write
    steps:

    - name: Checkout Package
      uses: actions/checkout@v7
      with:
        lfs: true

    - name: Free disk space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        large-packages: true
        tool-cache: true

    - name: Restore Library from cache
      uses: actions/cache@v6
      with:
        path: Library
        key: Library-base

    - name: Pull Docker image
      run: |
        docker pull unityci/editor:6000.0.85f1-base-3

    - name: Run Docker container
      run: |
        docker run \
        --name=my --rm -itd \
        -v $(pwd):/repo -w /repo \
        unityci/editor:6000.0.85f1-base-3

    - name: Activate Unity
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      run: |
        echo "$UNITY_LICENSE" > $(pwd)/Unity_lic.ulf

        docker exec my \
        unity-editor \
        -batchmode -nographics -quit -logFile - \
        -manualLicenseFile Unity_lic.ulf || true

        rm $(pwd)/Unity_lic.ulf

    - name: Build .tgz
      id: build_tgz
      run: |
        mkdir -p Builds

        docker exec my \
        unity-editor \
        -batchmode -nographics -quit -logFile - \
        -projectPath . \
        -executeMethod PackageBuilder.PackTgz

        echo "path=$(ls Builds/*.tgz)" >> $GITHUB_OUTPUT
        echo "name=$(basename Builds/*.tgz)" >> $GITHUB_OUTPUT

    - name: Upload .tgz to artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build_tgz.outputs.name }}
        path: ${{ steps.build_tgz.outputs.path }}
        archive: false
        retention-days: 5

    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        artifacts: ${{ steps.build_tgz.outputs.path }}
        artifactContentType: application/gzip
